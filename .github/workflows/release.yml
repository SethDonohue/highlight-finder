# Tests the program and publishes a GitHub Release with an installable package.
# Start it from Actions → Release → Run workflow (tags main as v<__version__>), or push a v* tag.
# No secrets needed. Release notes come from the tag message, or are generated when run by hand.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version in hlf/__init__.py
        run: |
          VERSION=$(grep -oP '__version__ = "\K[^"]+' hlf/__init__.py)
          if [ -z "$TAG" ]; then
            TAG="v$VERSION" # started by hand: tag main as v<__version__>
            echo "TAG=$TAG" >> "$GITHUB_ENV"
          fi
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match __version__ $VERSION in hlf/__init__.py"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; bump __version__ first"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Test (unit + end-to-end on made-up footage)
        run: |
          pip install -e . pytest build
          python -m pytest -q tests
          hlf --version

      - name: Build the package
        run: |
          python -m build
          git archive --format=zip --prefix="highlight-finder-$TAG/" -o "highlight-finder-$TAG-source.zip" HEAD
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="dist/*.whl highlight-finder-$TAG-source.zip"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            gh release create "$TAG" $FILES --title "Highlight Finder $TAG" --notes-from-tag --verify-tag
          else
            gh release create "$TAG" $FILES --title "Highlight Finder $TAG" --generate-notes --target "${{ github.sha }}"
          fi
